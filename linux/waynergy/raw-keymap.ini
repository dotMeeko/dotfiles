# Apple keyboard -> Linux keycodes for waynergy's uinput backend.
#
# uinput bypasses xkb entirely, so the macOS keycodes the server sends have to be
# mapped explicitly. Derived mechanically, not guessed: waynergy ships
# doc/xkb/keycodes/mac (Apple layout, values = macOS code + 8) and
# xkeyboard-config ships keycodes/evdev. Joining them on the xkb key name gives
# "incoming = local", where incoming is mac_file_value - 7 (the server sends
# macOS code + 1) and local is the X11 code (evdev + 8), which waynergy's uinput
# backend converts back with code -= 8.
#
# Validated against observed behaviour: Backspace arrived as 52 and typed "z";
# this table maps 52 -> 22 -> evdev 14 = KEY_BACKSPACE.
# Modifier correction (empirical, overrides the mac-file assumption): the three
# modifier codes do NOT follow doc/xkb/keycodes/mac. Observed on this setup:
#   56 = Mac Control -> Ctrl, 59 = Mac Command -> Super, 60 = Mac Option -> Alt.
# Derived from behaviour: Ctrl+Space switched layout (a Mod+Space bind),
# Win+Space opened spotlight (an Alt+Space bind), Alt+V pasted (a Ctrl+V bind).
#
# Regenerate interactively with:
#   waynergy-mapper -r -o ~/.config/waynergy/config.ini.d/raw-keymap.ini

