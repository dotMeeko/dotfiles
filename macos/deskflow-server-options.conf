# Deskflow server options for the Mac (server) paired with "odin" (NixOS client).
#
# WHAT THIS IS
# Only the `section: options` block, not a whole server config. The screens and
# links sections describe the physical layout and Deskflow generates them from
# its GUI, so keeping them here would mean maintaining geometry by hand twice.
#
# HOW TO APPLY, on the Mac
#   1. In ~/Library/Deskflow/Deskflow.conf, under [server]:
#          externalConfig=true
#          externalConfigFile=/Users/<you>/deskflow-server.conf
#   2. Restart Deskflow. When that file does not exist yet it is generated from
#      the current GUI layout, so screens and links come out correct by
#      themselves — do not write them by hand.
#   3. Append the block below to the END of that generated file, replacing its
#      own `section: options ... end` if it already has one. Restart Deskflow.
#
# The END matters: the file is parsed top to bottom and "names cannot be used
# before they've been defined in the screens or aliases sections", so
# switchToScreen(odin) above `section: screens` is a parse error.
#
# WHY relativeMouseMoves — this is the whole point of the file
# Without it the server streams ABSOLUTE cursor positions and the client plants
# the pointer at those coordinates. Two consequences on a Wayland client, both
# unfixable from the Linux side: libinput's acceleration never runs (it does not
# apply to absolute input at all, so niri's accel-speed is inert), and the
# pointer is quantised to the integer coordinate grid. That is why the mouse
# feels unlike a directly-attached one no matter what is tuned on NixOS.
#
# With it — and ONLY while the cursor is locked to a screen — the server sends
# relative deltas instead, and libinput treats them like any mouse. The path is
# verified end to end in waynergy 0.0.17, not assumed:
#   DMRM (uSynergy.c) -> syn_mouse_move_cb(rel=true) (main.c)
#   -> mouse_rel_motion -> EV_REL (wl_input_uinput.c)
#
# TRADE-OFF, know it before enabling: relative mode is live only while the
# cursor is locked, and while locked, crossing the screen edge no longer
# switches machines. Leaving is the lock hotkey, not the edge.
#
# MODIFIER NAMES
# These hotkeys are handled by the SERVER, i.e. by macOS, so they are written in
# Mac terms and are NOT affected by the client's raw-keymap (which remaps
# Option -> Super, Command -> Control, Control -> Alt on the Linux side).
# Valid names are shift, control, alt, meta, super; on a Mac keyboard
# alt = Option and super = Command. Command+Space is left alone, Spotlight owns it.
#
# NOT INCLUDED ON PURPOSE: `heartbeat`. It does not set the server's keepalive
# rate — the docs define it as the server expecting a message from each client at
# least every N ms and force-disconnecting after 3N. Lowering it would make
# dropouts MORE likely, not fewer. The client's own patience is a compile-time
# 10 s (USYNERGY_IDLE_TIMEOUT in waynergy) and is not configurable from here.

section: options
	# Relative pointer deltas while the cursor is locked to a screen.
	relativeMouseMoves = true

	# Lock/unlock the cursor on the current screen. This is the switch that turns
	# relative mode on and off, so it is the hotkey that actually matters.
	keystroke(alt+shift+l) = lockCursorToScreen(toggle)

	# Move the active screen WITHOUT the mouse. Needed the moment the mouse is
	# used natively on the Linux box: with no cursor crossing the edge, the
	# keyboard would otherwise stay on the Mac forever.
	keystroke(alt+shift+o) = switchToScreen(odin)
	keystroke(alt+shift+left) = switchInDirection(left)
	keystroke(alt+shift+right) = switchInDirection(right)
end
